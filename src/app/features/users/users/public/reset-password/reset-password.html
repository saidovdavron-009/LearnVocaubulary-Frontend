<section
  class="flex w-full max-w-130 flex-col items-center rounded-3xl border-2 border-line bg-surface px-6 py-10 text-center shadow-card sm:px-10"
  aria-labelledby="reset-title"
>
  @if (step() === 'code') {
    <span class="flex size-20 items-center justify-center rounded-card bg-mint text-fg shadow-hard shadow-violet-soft-deep">
      <app-icon name="mail" [size]="32" />
    </span>
    <h1 id="reset-title" class="mt-6 font-display text-h2 text-fg">Emailingizni tekshiring</h1>
    <p class="mt-4 text-body text-fg-secondary">
      {{ email() }} manziliga tasdiqlash kodini yubordik. Quyida 6 xonali kodni kiriting.
    </p>

    <form class="mt-6 flex w-full flex-col items-center gap-5" novalidate (submit)="$event.preventDefault(); confirmCode()">
      <app-otp-input [(value)]="code" [error]="codeError()" label="Parolni tiklash kodi" (completed)="confirmCode()" />
      <button appButton type="submit" size="l" [block]="true" [disabled]="code().length !== 6">Tasdiqlash</button>
    </form>

    <p class="mt-5 text-body text-fg-secondary">
      Kod kelmadimi?
      <button
        type="button"
        class="text-body-strong text-violet-text hover:underline disabled:text-fg-muted disabled:no-underline"
        [disabled]="resend.running()"
        (click)="resendCode()"
      >
        Qayta yuborish @if (resend.running()) {
          ({{ resend.label() }})
        }
      </button>
    </p>
  } @else {
    <span class="flex size-20 items-center justify-center rounded-card bg-violet text-fg-inverse shadow-hard shadow-violet-deep">
      <app-icon name="lock" [size]="32" />
    </span>
    <h1 id="reset-title" class="mt-6 font-display text-h2 text-fg">Yangi parol</h1>
    <p class="mt-4 text-body text-fg-secondary">{{ email() }} hisobi uchun yangi parol o'rnating.</p>

    <form [formGroup]="form" class="mt-6 flex w-full flex-col gap-5 text-left" novalidate (ngSubmit)="submit()">
      @if (error()) {
        <app-alert>{{ error() }}</app-alert>
      }
      <app-input
        label="Yangi parol"
        icon="lock"
        type="password"
        autocomplete="new-password"
        helper="Kamida 8 belgi, harf va raqam bilan"
        formControlName="newPassword"
        [errorMessages]="{ pattern: 'Parolda kamida bitta harf va bitta raqam bo‘lishi kerak' }"
      />
      <app-input
        label="Parolni takrorlang"
        icon="lock"
        type="password"
        autocomplete="new-password"
        formControlName="confirmPassword"
        [errorMessages]="{ mismatch: 'Parollar mos kelmadi' }"
      />
      <button appButton type="submit" size="l" icon="check" [block]="true" [loading]="loading()">Parolni saqlash</button>
    </form>

    <button
      type="button"
      class="mt-5 inline-flex items-center gap-2 text-body-strong text-fg-secondary hover:text-fg"
      (click)="step.set('code')"
    >
      <app-icon name="arrow-left" [size]="18" />
      Kodni o'zgartirish
    </button>
  }

  <a routerLink="/login" class="mt-4 inline-flex items-center gap-2 text-body-strong text-fg-secondary hover:text-fg">
    Kirish sahifasiga qaytish
  </a>
</section>
