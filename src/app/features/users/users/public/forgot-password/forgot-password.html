<section
  class="flex w-full max-w-130 flex-col items-center rounded-3xl border-2 border-line bg-surface px-6 py-10 text-center shadow-card sm:px-10"
  aria-labelledby="forgot-title"
>
  <span class="flex size-20 items-center justify-center rounded-card bg-yellow text-fg shadow-hard shadow-violet-soft-deep">
    <app-icon name="lock" [size]="32" />
  </span>
  <h1 id="forgot-title" class="mt-6 font-display text-h2 text-fg">Parolni tiklash</h1>
  <p class="mt-4 text-body text-fg-secondary">
    Email manzilingizni kiriting — sizga 6 xonali tiklash kodini yuboramiz. Kod 30 daqiqa amal qiladi.
  </p>

  <form [formGroup]="form" class="mt-6 flex w-full flex-col gap-5 text-left" novalidate (ngSubmit)="submit()">
    @if (error()) {
      <app-alert>{{ error() }}</app-alert>
    }
    <app-input
      label="Email"
      icon="mail"
      type="email"
      placeholder="siz@example.com"
      autocomplete="email"
      formControlName="email"
      [errorMessages]="{ required: 'Email kiriting' }"
    />
    <button appButton type="submit" size="l" icon="send" [block]="true" [loading]="loading()">Kodni yuborish</button>
  </form>

  <a routerLink="/login" class="mt-6 inline-flex items-center gap-2 text-body-strong text-fg-secondary hover:text-fg">
    <app-icon name="arrow-left" [size]="18" />
    Kirish sahifasiga qaytish
  </a>
</section>
